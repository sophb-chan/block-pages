<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">

	<title>example.com</title>

	<style>
		:root {
			color-scheme: light dark;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			height: 100%;
			margin: 0;
		}

		body {
			background: #202124;
			color: #bdc1c6;

			font-family:
				"Segoe UI",
				Roboto,
				"Helvetica Neue",
				Arial,
				sans-serif;

			font-size: 15px;
		}

		.error-wrapper {
			width: 100%;
			max-width: 600px;

			margin: 0 auto;
			padding: 108px 40px 0;
		}

		.icon {
			width: 52px;
			height: 52px;

			margin-bottom: 39px;

			color: #9aa0a6;
		}

		.icon svg {
			display: block;
			width: 100%;
			height: 100%;
		}

		h1 {
			margin: 0 0 18px;

			color: #bdc1c6;

			font-size: 24px;
			font-weight: 500;
			line-height: 1.25;
		}

		p {
			margin: 0;

			color: #9aa0a6;

			font-size: 15px;
			line-height: 1.5;
		}

		@media (max-width: 700px) {
			.error-wrapper {
				padding-left: 28px;
				padding-right: 28px;
			}
		}

		@media (prefers-color-scheme: light) {
			body {
				background: #fff;
				color: #202124;
			}
			h1 {
				color: #202124;
			}
			p {
				color: #646368;
			}
			.icon {
				color: #535353;
			}
		}
	</style>
</head>

<body>
	<main class="error-wrapper">

		<div class="icon" aria-hidden="true">
			<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">

				<circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="4" />

				<rect x="22" y="20" width="4" height="15" rx="1" fill="currentColor" />

				<circle cx="24" cy="14" r="2.4" fill="currentColor" />
			</svg>
		</div>

		<h1>This page is blocked</h1>

		<p>
			Your organization doesn’t allow you to view this site
		</p>

	</main>
</body>

</html>
